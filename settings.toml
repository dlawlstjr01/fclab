# FC Lab 설정 — 근거 품질에 영향을 주는 값은 코드가 아니라 여기서 바꾼다. (명세서 2.5 · F2005 · F2006)
# 비밀 값(GMS_KEY · NEXON_API_KEY · WIKI_CONTACT)은 이 파일이 아니라 .env 에 둔다. (NF2003)

[paths]
data_dir = "data"         # build_items.py 가 만든 players.json 이 있는 폴더 (이 파일 기준 상대 경로)
storage_dir = "storage"   # Chroma DB · 수집한 위키 문서 · 수집 이력

[models]
chat = "gpt-4o-mini"
embedding = "text-embedding-3-small"
base_url = "https://gms.ssafy.io/gmsapi/api.openai.com/v1/"

[items]
seasons = [866, 101, 100]   # 항목으로 쓸 FC 온라인 시즌 ID — 866: 26 TOTS(현역 베스트), 101: ICON, 100: ICON TM(ICON The Moment)
matchtype = 50         # 랭커 스탯 기준 경기 종류 (50 = 공식경기)

[chunking]
chunk_size = 1000      # 선수 문서는 시즌별 경력 문단이 길다. 한 시즌 서술이 한 청크에 들어가는 크기
chunk_overlap = 200    # 문단 경계에서 잘린 문장이 양쪽 청크에 모두 남도록

[retrieval]
top_k = 6                    # 외부 문서 청크 수 (비교는 선수마다 나눠 가져온다). 선수 메타데이터는 검색 없이 항상 더한다
search_type = "similarity"   # "similarity" 또는 "mmr" (심화 F2014)
mmr_fetch_k = 20             # MMR 일 때 먼저 넉넉히 가져올 후보 수
mmr_lambda = 0.5             # 1 에 가까울수록 유사도, 0 에 가까울수록 다양성

[collect]
max_keywords = 4          # 프롬프트 1이 뽑을 검색어 최대 개수
search_limit = 5          # 검색어 하나당 후보 수
max_docs = 4              # 프롬프트 2가 고를 문서 최대 개수 (선수 자체 문서는 따로 항상 색인)
min_doc_chars = 300       # 이보다 짧은 본문은 버린다 (선수 자체 문서는 예외)
request_interval = 0.3    # 위키백과 호출 간격(초) — 연락처가 있으면 분당 200회까지라 0.3초(분당 약 200회).
                          # WIKI_CONTACT 가 없으면 6.5초로 늘린다 (분당 10회 한도) — NF2006
parallel = 4              # 검색 · 본문 수집을 동시에 보낼 수 (호출 간격은 위 값으로 지킨다)

[market]
# 강화 단계별 시세 · 능력치 · 특성 — FC 온라인 홈페이지 데이터센터 화면에서 읽는다 (넥슨 Open API 에는 없다).
# 공식 API 가 아니므로 넥슨 약관을 확인할 것. 공개 서비스로 배포할 때는 enabled = false.
enabled = true
interval = 1.2              # 요청 간격(초) — 1초보다 짧게는 보내지 않는다
current_ttl_minutes = 30    # 현재가: 선수 검색 1번에 그 선수 카드 전부 · 강화 1~13 (이 시간 안에 받은 것은 다시 받지 않는다)
ttl_hours = 6               # 일별 시세(그래프 · 사기/팔기 판단): 카드 · 강화마다 1번 — 현재가가 먼저 보인 뒤 뒤이어
refresh_minutes = 60        # 최근 본 카드 · 즐겨찾기의 현재가를 이 간격으로 다시 받아 둔다 (바뀐 값만 기록에 남긴다)
catch_up = 60               # 앱을 켤 때 밀린 일별 시세(꺼져 있던 동안)를 다시 받을 최대 요청 수 — 나머지는 카드를 열 때

[stats]
# 모든 카드의 능력치 · 급여 · OVR 을 데이터센터 선수 검색으로 모아 DB 에 둔다 (services/stats.py) — [market] enabled 가 false 면 같이 꺼진다.
# 처음 전부 모으는 데 요청 약 1만 번(몇 시간)이 걸린다. 앱을 끄면 멈췄다가 다음에 켤 때 이어서 한다.
enabled = true
interval = 1.5      # 이 수집이 요청 한 번마다 쉬는 시간(초) — 화면의 시세 · 카드 상세 요청이 먼저 지나가게
refresh_days = 7    # 이 날짜가 지난 시즌은 다시 훑어 급여(로스터 패치) · OVR 을 갱신한다. 새 시즌 · 새 카드는 바로

[ranker]
# 분석해 둔 카드(미리 분석한 432장 + 앱에서 연 카드)의 대표 포지션 랭커 기록을 이 시간마다 다시 받는다 (services/ranker_refresh.py).
# 4 = 하루 6번. 카드 40장이 요청 1번이라 한 번에 약 15번 (넥슨 Open API 테스트 키 하루 1,000회). 0 이면 끈다.
refresh_hours = 4
refresh_reserve = 300   # 오늘 남은 넥슨 호출이 이보다 적으면 이번 차례는 쉰다 (사용자가 누르는 동작에 남겨 둔다)

[explore]
candidates = 30    # 조건 기반 탐색: DB 전체로 거른 후보가 15명보다 적을 때 메타데이터 색인 의미 검색으로 보탤 수
max_results = 12   # LLM 이 조건에 맞는다고 고를 최대 개수
